<ion-header>
  <ion-toolbar>
    <ion-segment [(ngModel)]="salonSeleccionado">
        @for (salon of salones; track $index) {
            <ion-segment-button [value]="salon.id" (click)="ObtenerMesas(salon.id!)">
                <ion-label>{{salon.descripcion}}</ion-label>
            </ion-segment-button>
        }
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- Recarga de la informacion -->
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content
      pullingIcon="chevron-down-circle-outline"
      pullingText="Desliza hacia abajo para actualizar"
      refreshingSpinner="circles"
      refreshingText="Actualizando..."
    >
    </ion-refresher-content>
  </ion-refresher>

  <!-- Lista de resultados -->
  @if (mesas.length == 0) {
   <div class="alerta alerta-warn">
        <span class="alerta-icon">⚠️</span>
        <div class="alerta-texto">
          No se encontraron mesas disponibles en este salón. Es posible que aún no tengas mesas asignadas.        
        </div>
    </div>
  }@else {
    <div class="grid">
      <div class="card ocupada" *ngFor="let mesa of mesas" [ngClass]="{'disponible':mesa.estado == 'Disponible', 'pendiente':mesa.estado == 'Pago Pendiente'}" (click)="NuevoPedido(mesa)">
        <h3>{{ mesa.numero }}</h3>
      </div>
    </div>
  }
</ion-content>
